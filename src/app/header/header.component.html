<!-- Announcement Bar -->
<div class="announce-bar">
    <span>🌿 Pure. Natural. Authentic. From the valleys of Jammu & Kashmir.</span>
    <span>🚚 Free Shipping on orders above ₹500</span>
</div>

<!-- Header -->
<header>
    <div class="header-inner">

        <!-- Logo -->
        <a routerLink="/" class="logo">
            <!-- <div class="logo-icon">🌿</div> -->
            <div>
                <!-- <span class="brand">swaad e kashmir</span>
                <span class="tagline">Pure · Natural · Authentic</span> -->
                <img src="assets/images/new.png" alt="Swaad e Kashmir Logo" class="logo-image" />
            </div>
        </a>

        <!-- Desktop Nav -->
        <nav [class.open]="menuOpen">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
            <a routerLink="/products" routerLinkActive="active">Shop</a>
            <a routerLink="/about" routerLinkActive="active">About Us</a>
            <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
            <a routerLink="/contact" routerLinkActive="active">Contact Us</a>
        </nav>

        <!-- Icons -->
        <div class="header-icons">

                </svg>
            </button> -->
